<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi closet</title>
<style>
:root{color-scheme:light dark;--bg:#eef1f3;--fg:#16202b;--card:#fff;--line:#d3dae0;--acc:#3b4cca;--onacc:#fff;--mut:#5f6b77;--stage:#dfe5ea}
@media(prefers-color-scheme:dark){:root{--bg:#12171c;--fg:#e8edf1;--card:#1c232a;--line:#2f3943;--acc:#8c9bff;--onacc:#10143a;--mut:#9aa6b2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
main{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:24px;max-width:1040px;margin:0 auto;padding:20px}
@media(max-width:760px){main{grid-template-columns:1fr;padding:14px}}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
select,input[type=text]{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 9px;min-width:0}
#stage{position:relative;width:min(100%,340px);aspect-ratio:1/2;margin:0 auto;background:var(--stage);border-radius:14px;overflow:hidden;touch-action:none}
#sil{position:absolute;inset:0;width:100%;height:100%;color:#b6c0ca}
#av{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
#layer{position:absolute;inset:0}
.piece{position:absolute;transform:translate(-50%,-50%);touch-action:none;cursor:grab;user-select:none;-webkit-user-drag:none}
.piece.sel{outline:2px dashed var(--acc);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.row label{display:flex;gap:8px;align-items:center;color:var(--mut)}
#size{flex:1;min-width:120px;accent-color:var(--acc)}
.hint{color:var(--mut);font-size:13px;margin:8px 0 0;text-align:center}
#tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:12px}
#tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;font-weight:600;color:var(--mut)}
#tabs button.on{border-color:var(--acc);color:var(--fg)}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border-radius:999px;padding:4px 12px;font-size:14px}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
summary{cursor:pointer;font-weight:600}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.card img{width:100%;height:150px;object-fit:contain;background:var(--stage);border-radius:6px;cursor:pointer}
.nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card select{font-size:13px;padding:4px 6px}
.del{position:absolute;top:10px;right:10px;padding:0 8px;line-height:24px;border-radius:999px;font-size:16px}
.empty{grid-column:1/-1;color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>Mi closet</h1>
  <div class="row" style="margin:0">
    <button id="exp">Descargar respaldo</button>
    <label class="row" style="margin:0"><button onclick="this.nextElementSibling.click()">Cargar respaldo</button><input id="imp" type="file" accept=".json" hidden></label>
  </div>
</header>
<main>
  <section>
    <div id="stage">
      <svg id="sil" viewBox="0 0 100 200" fill="currentColor" aria-hidden="true"></svg>
      <img id="av" alt="Mi foto" hidden>
      <div id="layer"></div>
    </div>
    <p class="hint">Arrastra las prendas sobre el muñeco.</p>
    <div class="row">
      <label>Tamaño <input id="size" type="range" min="10" max="120" disabled></label>
      <button id="rmPiece">Quitar prenda</button>
      <button id="clear">Vaciar</button>
    </div>
    <div class="row">
      <button onclick="this.nextElementSibling.click()">Subir mi foto</button><input id="avf" type="file" accept="image/*" hidden>
      <button id="avx">Usar silueta</button>
    </div>
    <div class="row">
      <input id="oname" type="text" placeholder="Nombre del outfit" style="flex:1">
      <select id="ofol"></select>
      <button id="saveOut" class="pri">Guardar outfit</button>
    </div>
  </section>
  <section>
    <div id="tabs"><button data-t="items" class="on">Prendas</button><button data-t="outfits">Outfits</button></div>
    <div id="chips"></div>
    <details id="addbox">
      <summary>Agregar prenda</summary>
      <div class="row"><input id="gf" type="file" accept="image/*"></div>
      <div class="row">
        <input id="gn" type="text" placeholder="Nombre (opcional)">
        <select id="gc"></select>
        <select id="gfol"></select>
      </div>
      <div class="row">
        <label><input id="rm" type="checkbox" checked> Quitar fondo liso de la foto</label>
        <button id="addBtn" class="pri">Guardar prenda</button>
      </div>
    </details>
    <div id="grid"></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const CAT={top:'Playera / top',jacket:'Chamarra',pants:'Pantalón',shoes:'Zapatos',acc:'Accesorio'};
const Z={pants:1,shoes:1,top:2,jacket:3,acc:4};
const DEF={top:[.5,.30,.5],jacket:[.5,.32,.58],pants:[.5,.62,.42],shoes:[.5,.92,.40],acc:[.5,.12,.2]};
const SIL=['M45 26h10v8H45z','M30 36h40l8 56h-7l-3-34-1 40H33l-1-40-3 34h-7z','M34 98h32l-2 94H53l-3-64-3 64H36z'];
let S={items:[],outfits:[],folders:['Casual diario','Gym','Wishlist'],avatar:null},cur=[],sel=null,tab='items',fol='Todas';

/* Guardado en el navegador (IndexedDB) */
const db=new Promise((ok,no)=>{const r=indexedDB.open('closet',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=no});
const load0=()=>new Promise(ok=>db.then(d=>{const q=d.transaction('k').objectStore('k').get('s');q.onsuccess=()=>ok(q.result);q.onerror=()=>ok()}).catch(()=>ok()));
const save=()=>db.then(d=>d.transaction('k','readwrite').objectStore('k').put(S,'s')).catch(()=>{});

/* Imágenes: reducir tamaño y, si se pide, quitar fondo liso */
const ld=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
function cut(x,w,h){
  const d=x.getImageData(0,0,w,h),p=d.data,k=(i,j)=>(j*w+i)*4;
  const cs=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]].map(([i,j])=>[p[k(i,j)],p[k(i,j)+1],p[k(i,j)+2]]);
  const bg=[0,1,2].map(n=>cs.reduce((a,c)=>a+c[n],0)/4);
  const seen=new Uint8Array(w*h),st=[];
  const push=(i,j)=>{if(i<0||j<0||i>=w||j>=h)return;const n=j*w+i;if(seen[n])return;seen[n]=1;const q=n*4;
    if(Math.abs(p[q]-bg[0])+Math.abs(p[q+1]-bg[1])+Math.abs(p[q+2]-bg[2])<100){p[q+3]=0;st.push(n)}};
  for(let i=0;i<w;i++){push(i,0);push(i,h-1)}
  for(let j=0;j<h;j++){push(0,j);push(w-1,j)}
  while(st.length){const n=st.pop(),i=n%w,j=(n-i)/w;push(i+1,j);push(i-1,j);push(i,j+1);push(i,j-1)}
  x.putImageData(d,0,0);
}
async function fit(file,max,rm){
  const u=URL.createObjectURL(file),im=await ld(u);URL.revokeObjectURL(u);
  const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
  if(rm)cut(x,c.width,c.height);
  return c.toDataURL(rm?'image/png':'image/jpeg',.85);
}

/* Muñeco */
function renderStage(){
  cur=cur.filter(o=>S.items.some(i=>i.id===o.id));
  $('#av').src=S.avatar||'';$('#av').hidden=!S.avatar;$('#sil').style.display=S.avatar?'none':'';
  const box=$('#layer');box.innerHTML='';
  cur.forEach(o=>{
    const it=S.items.find(i=>i.id===o.id),im=new Image();
    im.src=it.img;im.alt=it.name;im.draggable=false;im.dataset.id=o.id;
    im.className='piece'+(o.id===sel?' sel':'');
    Object.assign(im.style,{left:o.x*100+'%',top:o.y*100+'%',width:o.w*100+'%',zIndex:Z[it.cat]});
    im.onpointerdown=e=>drag(e,o);box.append(im);
  });
  const o=cur.find(p=>p.id===sel);if(!o)sel=null;
  $('#size').disabled=!o;if(o)$('#size').value=o.w*100;
}
function drag(e,o){
  e.preventDefault();e.stopPropagation();sel=o.id;const el=e.currentTarget;
  document.querySelectorAll('.piece').forEach(p=>p.classList.toggle('sel',p===el));
  $('#size').disabled=false;$('#size').value=o.w*100;
  const r=$('#stage').getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=o.x,oy=o.y;
  const mv=v=>{o.x=ox+(v.clientX-sx)/r.width;o.y=oy+(v.clientY-sy)/r.height;el.style.left=o.x*100+'%';el.style.top=o.y*100+'%'};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
}
function wear(it){
  cur=cur.filter(o=>it.cat==='acc'?o.id!==it.id:S.items.find(i=>i.id===o.id)?.cat!==it.cat);
  const d=DEF[it.cat];cur.push({id:it.id,x:d[0],y:d[1],w:d[2]});sel=it.id;renderStage();
}
function loadOutfit(o){cur=o.pieces.map(p=>({...p}));sel=null;renderStage()}
async function thumb(){
  const W=240,H=480,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');x.fillStyle='#dfe5ea';x.fillRect(0,0,W,H);
  if(S.avatar){const i=await ld(S.avatar),k=Math.min(W/i.width,H/i.height);x.drawImage(i,(W-i.width*k)/2,(H-i.height*k)/2,i.width*k,i.height*k)}
  else{x.save();x.scale(2.4,2.4);x.fillStyle='#b6c0ca';x.beginPath();x.arc(50,16,11,0,7);x.fill();SIL.forEach(d=>x.fill(new Path2D(d)));x.restore()}
  const L=cur.map(p=>({p,it:S.items.find(i=>i.id===p.id)})).filter(a=>a.it).sort((a,b)=>Z[a.it.cat]-Z[b.it.cat]);
  for(const {p,it} of L){const i=await ld(it.img),w=p.w*W,h=w*i.height/i.width;x.drawImage(i,p.x*W-w/2,p.y*H-h/2,w,h)}
  return c.toDataURL('image/jpeg',.8);
}

/* Panel de prendas y outfits */
function fillSel(){
  ['#gfol','#ofol'].forEach(id=>{const s=$(id),v=s.value;s.innerHTML='';S.folders.forEach(f=>s.add(new Option(f)));if(S.folders.includes(v))s.value=v});
}
function card(o){
  const d=document.createElement('div');d.className='card';
  const im=new Image();im.src=o.img;im.alt=o.name;im.title=tab==='items'?'Poner en el muñeco':'Cargar outfit';
  im.onclick=()=>tab==='items'?wear(o):loadOutfit(o);
  const n=document.createElement('div');n.className='nm';n.textContent=o.name+(tab==='items'?' · '+CAT[o.cat]:'');
  const s=document.createElement('select');S.folders.forEach(f=>s.add(new Option(f)));s.value=o.folder;
  s.onchange=()=>{o.folder=s.value;save();renderPanel()};
  const x=document.createElement('button');x.textContent='×';x.className='del';x.title='Eliminar';
  x.onclick=()=>{
    if(!confirm('¿Eliminar «'+o.name+'»?'))return;
    const a=tab==='items'?S.items:S.outfits;a.splice(a.indexOf(o),1);
    save();renderStage();renderPanel();
  };
  d.append(im,n,s,x);return d;
}
function renderPanel(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const ch=$('#chips');ch.innerHTML='';
  ['Todas',...S.folders].forEach(f=>{
    const b=document.createElement('button');b.textContent=f;b.className='chip'+(f===fol?' on':'');
    b.onclick=()=>{fol=f;renderPanel()};ch.append(b);
  });
  const add=document.createElement('button');add.textContent='+ Carpeta';add.className='chip';
  add.onclick=()=>{const n=(prompt('Nombre de la carpeta')||'').trim();if(n&&!S.folders.includes(n)){S.folders.push(n);save();fillSel();renderPanel()}};
  ch.append(add);
  $('#addbox').hidden=tab!=='items';
  if(fol!=='Todas')$('#gfol').value=fol;
  const g=$('#grid');g.innerHTML='';
  const list=(tab==='items'?S.items:S.outfits).filter(o=>fol==='Todas'||o.folder===fol);
  if(!list.length){g.innerHTML='<p class="empty">'+(tab==='items'?'No hay prendas aquí. Agrega una con la foto de tu prenda.':'No hay outfits aquí. Arma uno en el muñeco y guárdalo.')+'</p>';return}
  list.forEach(o=>g.append(card(o)));
}

/* Eventos */
$('#sil').innerHTML='<circle cx="50" cy="16" r="11"/>'+SIL.map(d=>'<path d="'+d+'"/>').join('');
Object.entries(CAT).forEach(([k,v])=>$('#gc').add(new Option(v,k)));
$('#stage').onpointerdown=()=>{sel=null;renderStage()};
$('#size').oninput=e=>{
  const o=cur.find(p=>p.id===sel);if(!o)return;
  o.w=e.target.value/100;const el=document.querySelector('.piece[data-id="'+sel+'"]');if(el)el.style.width=o.w*100+'%';
};
$('#rmPiece').onclick=()=>{cur=cur.filter(p=>p.id!==sel);sel=null;renderStage()};
$('#clear').onclick=()=>{cur=[];sel=null;renderStage()};
$('#avf').onchange=async e=>{const f=e.target.files[0];if(f){S.avatar=await fit(f,900,false);save();renderStage()}e.target.value=''};
$('#avx').onclick=()=>{S.avatar=null;save();renderStage()};
$('#tabs').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;fol='Todas';renderPanel()}};
$('#addBtn').onclick=async()=>{
  const f=$('#gf').files[0];if(!f)return alert('Elige primero la foto de la prenda.');
  const img=await fit(f,600,$('#rm').checked),cat=$('#gc').value;
  S.items.push({id:uid(),name:$('#gn').value.trim()||CAT[cat],cat,folder:$('#gfol').value,img});
  $('#gf').value='';$('#gn').value='';save();renderPanel();
};
$('#saveOut').onclick=async()=>{
  if(!cur.length)return alert('Pon al menos una prenda en el muñeco para guardar el outfit.');
  const name=$('#oname').value.trim()||'Outfit '+(S.outfits.length+1);
  S.outfits.push({id:uid(),name,folder:$('#ofol').value,pieces:cur.map(p=>({...p})),img:await thumb()});
  $('#oname').value='';save();tab='outfits';fol='Todas';renderPanel();
};
$('#exp').onclick=()=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
  a.download='mi-closet.json';a.click();
};
$('#imp').onchange=async e=>{
  try{
    const j=JSON.parse(await e.target.files[0].text());
    if(!Array.isArray(j.items)||!Array.isArray(j.outfits))throw 0;
    S={...S,...j};cur=[];sel=null;save();fillSel();renderStage();renderPanel();
  }catch{alert('El archivo no es un respaldo válido de Mi closet.')}
  e.target.value='';
};
(async()=>{const s=await load0();if(s)S={...S,...s};fillSel();renderStage();renderPanel()})();
</script>
</body>
</html>
